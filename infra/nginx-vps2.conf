server {
    listen 80;
    listen [::]:80;
    server_name lekkerkuier.com www.lekkerkuier.com;
    # Load-balancing identifier
    add_header X-Served-By "vps2" always;
    client_max_body_size 250m;

    # Auth API — proxy to VPS1 via Tailscale
    location /api/auth/ {
        proxy_pass http://100.125.93.34:3001/api/auth/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # AzuraCast API — proxy to VPS1 via Tailscale
    location /api/ {
        proxy_pass http://100.125.93.34:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Audio stream — proxy to VPS1 AzuraCast via Tailscale
    location = /autodj.mp3 {
        proxy_pass http://100.125.93.34:8080/listen/lekkerkuier/radio.mp3;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_cache off;
    }

    # AzuraCast radio/listen mounts
    location ~ ^/(radio|listen)/ {
        proxy_pass http://100.125.93.34:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    # React SPA
    location / {
        root /var/www/lekkerkuier;
        try_files $uri $uri/ /index.html;

        location ~* \.(?:css|js|woff2?|png|jpg|svg|ico|webp)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }
}
