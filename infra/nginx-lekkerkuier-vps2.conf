# Lekker Kuier Psy Radio — Nginx config (VPS2 — proxies API to VPS1 via Tailscale)
# Serves React SPA at /, proxies API + streams to VPS1's AzuraCast on 100.125.93.34:8080

# www → non-www redirect
server {
    server_name www.lekkerkuier.com;

    listen [::]:443 ssl;
    listen 443 ssl;
    ssl_certificate /root/.acme.sh/lekkerkuier.com/fullchain.cer;
    ssl_certificate_key /root/.acme.sh/lekkerkuier.com/lekkerkuier.com.key;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    return 301 https://lekkerkuier.com$request_uri;
}

# Main site — React SPA with AzuraCast API/stream proxy to VPS1
server {
    server_name lekkerkuier.com;
    client_max_body_size 250m;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Auth API — proxy to Node.js backend (must come before /api/)
    location /api/auth/ {
        proxy_pass http://127.0.0.1:3001/api/auth/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API — proxy to VPS1's AzuraCast via Tailscale
    location /api/ {
        proxy_pass http://100.125.93.34:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Authorization "Bearer a6acb1bd58608448:3b48bc3dc682f7516d49b8f2bdf553e1";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Audio stream — proxy to VPS1's AzuraCast
    location = /autodj.mp3 {
        proxy_pass http://100.125.93.34:8080/listen/lekkerkuier/radio.mp3;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
    }

    location /radio/ {
        proxy_pass http://100.125.93.34:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /listen/ {
        proxy_pass http://100.125.93.34:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # React SPA — static files served from /var/www/lekkerkuier
    location / {
        root /var/www/lekkerkuier;
        try_files $uri $uri/ /index.html;

        location ~* \.(?:css|js|woff2?|png|jpg|svg|ico|webp)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }

    listen [::]:443 ssl;
    listen 443 ssl;
    ssl_certificate /root/.acme.sh/lekkerkuier.com/fullchain.cer;
    ssl_certificate_key /root/.acme.sh/lekkerkuier.com/lekkerkuier.com.key;
    include /etc/letsencrypt/options-ssl-nginx.conf;
}

# Admin subdomain — proxy to VPS1's AzuraCast admin via Tailscale
server {
    server_name admin.lekkerkuier.com;

    location / {
        proxy_pass https://100.125.93.34:8443;
        proxy_http_version 1.1;
        proxy_ssl_verify off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    listen [::]:443 ssl;
    listen 443 ssl;
    ssl_certificate /root/.acme.sh/lekkerkuier.com/fullchain.cer;
    ssl_certificate_key /root/.acme.sh/lekkerkuier.com/lekkerkuier.com.key;
    include /etc/letsencrypt/options-ssl-nginx.conf;
}

# HTTP — serves SPA for Cloudflare tunnel (Cloudflare provides SSL termination)
server {
    listen 80;
    listen [::]:80;
    server_name lekkerkuier.com www.lekkerkuier.com;
    client_max_body_size 250m;

    add_header X-Served-By "vps2" always;

    location = /health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok","server":"vps2","timestamp":"$time_iso8601"}';
    }

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location /api/auth/ {
        proxy_pass http://127.0.0.1:3001/api/auth/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /api/ {
        proxy_pass http://100.125.93.34:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Authorization "Bearer a6acb1bd58608448:3b48bc3dc682f7516d49b8f2bdf553e1";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /autodj.mp3 {
        proxy_pass http://100.125.93.34:8080/listen/lekkerkuier/radio.mp3;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_cache off;
    }

    location /radio/ {
        proxy_pass http://100.125.93.34:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /listen/ {
        proxy_pass http://100.125.93.34:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        root /var/www/lekkerkuier;
        try_files $uri $uri/ /index.html;

        location ~* \.(?:css|js|woff2?|png|jpg|svg|ico|webp)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name admin.lekkerkuier.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        proxy_pass https://100.125.93.34:8443;
        proxy_http_version 1.1;
        proxy_ssl_verify off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
