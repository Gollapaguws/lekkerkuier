name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  # ─── Frontend: typecheck + test + build + coverage ────
  frontend:
    name: Frontend (typecheck · test · build · coverage)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src-new
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: src-new/package-lock.json

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test + Coverage
        run: npm run test:coverage

      - name: Build
        run: npm run build

  # ─── Backend: test + coverage ─────────────────────────
  backend:
    name: Backend (test · coverage)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-auth
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: backend-auth/package-lock.json

      - run: npm ci

      - name: Test + Coverage
        run: npm run test:coverage
