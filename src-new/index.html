    <!--
      Phase 5 polyfill block (2026-07-19).
      Guards against SPA bundles that reference `isLoadingPublicSettings`
      / `setIsLoadingPublicSettings` symbols imported before they are
      exported by a (potentially stale or freshly-built) upstream
      bundle. Defensive only — DO NOT REMOVE.
    -->
    <script>
      ;(function () {
        try {
          // Polyfill core defensive globals (the prior SPA bundle
          // crashes on the 'ej' layout helper if these resolve to
          // `null` / `undefined` — Path-X defect 2026-07-19).
          // Using `globalThis` (not `window`) keeps canonical
          // consistency with the inline polyfill that lives in
          // /opt/radio/web/public/index.html and was the
          // canonical pre-Vite pattern.
          if (typeof globalThis.isLoadingPublicSettings === 'undefined') {
            globalThis.isLoadingPublicSettings = false;
          }
          if (typeof globalThis.setIsLoadingPublicSettings === 'undefined') {
            globalThis.setIsLoadingPublicSettings = function () {};
          }
          // Public settings (admin defaults that the SPA reads
          // before its own API settles) — empty object. The upstream
          // bundle reads `publicSettings.thing`; an empty object
          // gives safe `undefined` reads that the SPA's
          // optional-chaining protects against.
          if (typeof globalThis.publicSettings === 'undefined') {
            globalThis.publicSettings = {};
          }
          // ServiceWorker unregister: kill any rogue SW leftover
          // from earlier SSG / runtime caches. Without this, a
          // cached SW can intercept the navigation and serve the
          // pre-polyfill build → black screen.
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function (regs) {
              for (var i = 0; i < regs.length; i++) {
                try { regs[i].unregister(); } catch (_) { /* ignore */ }
              }
            });
          }
        } catch (_) { /* best-effort; ignore */ }
      })();
    </script>

    <!--
      Theme bootstrap (anti-FOUC). Reads
      `localStorage['lekkerkuier-theme']` and applies the matching
      `data-theme="..."` attribute on <html> BEFORE React mounts,
      so the initial paint already uses the selected palette and
      there is no flash of the default theme.
    -->
    <script>
      ;(function () {
        try {
          var theme = localStorage.getItem('lekkerkuier-theme');
          var allowed = ['cosmic', 'industrial', 'psytech'];
          if (!theme || allowed.indexOf(theme) < 0) theme = 'psytech';
          document.documentElement.setAttribute('data-theme', theme);
        } catch (_) {
          document.documentElement.setAttribute('data-theme', 'psytech');
        }
      })();
    </script>
